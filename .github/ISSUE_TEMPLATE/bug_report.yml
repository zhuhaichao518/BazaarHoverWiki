name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿在公开 Issue 中提交安全漏洞；请使用 Security Advisory。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 将鼠标移到……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 请先删除账号名、路径等隐私信息。
      render: text
