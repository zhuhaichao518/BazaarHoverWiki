name: Feature request
description: 提议一个符合安全边界的新功能
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 安全边界
      options:
        - label: 不需要注入或修改游戏
          required: true
        - label: 不读取内存、网络或账号信息
          required: true
        - label: 不打包专有游戏资源
          required: true
